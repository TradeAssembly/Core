[package]
name = "tradeassembly-distribution"
version = "0.1.0"
edition = "2021"
publish = false
license-file = "../LICENSE"

[dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
fs2 = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = "0.33"
tar = "0.4"
tempfile = "3"
walkdir = "2"
