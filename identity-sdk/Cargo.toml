[package]
name = "tradeassembly-identity-sdk"
version = "0.1.0"
edition = "2021"
publish = false
license-file = "../LICENSE"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
http = "1"
openidconnect = "4.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", features = ["oid"] }
thiserror = "2"
tokio = { version = "1", features = ["sync"] }
url = "2"

[dev-dependencies]
axum = "0.8"
aws-lc-rs = "=1.18.1"
pkcs1 = "=0.7.5"
ring = "=0.17.14"
serde_urlencoded = "0.7"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync"] }
