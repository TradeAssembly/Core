apiVersion: tradeassembly.org/v1alpha1
kind: TradeAssemblyPluginManifest
manifestVersion: "0.1"
metadata:
  id: tradeassembly.core-runtime
  name: TradeAssembly Core Runtime
  version: 0.1.0
  provider:
    id: tradeassembly
    name: TradeAssembly
runtime:
  protocol: rust-native
  entrypoint: runtime-rs::service::providers::CoreRuntime
  timeoutSeconds: 5
capabilities:
  - id: plugin.capability_matrix
    description: Report plugin capabilities, operations, APF metadata, and host compatibility.
  - id: market_data.bars.read@1
    description: Read bars from an immutable local dataset snapshot for deterministic research.
  - id: expression.cel.evaluate@1
    description: Evaluate deterministic StrategySpec CEL expressions.
  - id: calendar.session.resolve@1
    description: Resolve deterministic market-session eligibility.
  - id: order.intent.build@1
    description: Build broker-neutral order intents.
  - id: order.option.submit@1
    description: Build broker-neutral single-leg option order intents.
  - id: order.option_combo.submit@1
    description: Build broker-neutral multi-leg option order intents.
  - id: indicator.bars.normalize@1
    description: Normalize bar inputs for indicator calculations.
  - id: indicator.stateful.calculate@1
    description: Calculate deterministic stateful indicators.
  - id: universe.static.select@1
    description: Evaluate owner-defined portfolio research with deterministic inputs.
  - id: signal.rule.evaluate@1
    description: Evaluate owner-defined portfolio research with deterministic inputs.
  - id: intent.trade.build@1
    description: Evaluate owner-defined portfolio research with deterministic inputs.
  - id: sizing.relative.apply@1
    description: Evaluate owner-defined portfolio research with deterministic inputs.
  - id: risk.strategy.guard@1
    description: Evaluate owner-defined portfolio research with deterministic inputs.
  - id: exit.policy.evaluate@1
    description: Evaluate owner-defined portfolio research with deterministic inputs.
  - id: price.snapshot.select@1
    description: Evaluate owner-defined portfolio research with deterministic inputs.
permissions:
  - id: local.state.read
    description: Read immutable local StrategySpec and run inputs.
hostApis:
  - id: tradeassembly.journal.append
    description: Append redacted deterministic runtime evidence.
  - id: tradeassembly.clock.now
    description: Read the host-provided deterministic event time.
operations:
  - id: plugin.capability_matrix
    capability: plugin.capability_matrix
    protocol: local-rust
    effect: read
    riskClass: low
    resourceType: plugin
    credentialGrantRequired: false
    accountBindingRequired: false
    financeAction:
      actionId: plugin.capability_matrix
      resourceType: plugin
    mandateRequired: false
    purpose: plugin_administration
    sessionAdmission:
      mode: user_or_agent_session
    approval:
      mode: policy_configured
    supervision:
      mode: automated_policy
    detectors:
      - no_advice
      - capability_scope
      - plugin_manifest_integrity
    contextProviders:
      - sightline.session_context
      - tradeassembly.plugin_context
    policyRefs:
      - apf.finance.default
      - tradeassembly.local_full
    traits:
      modes: []
      instrumentFamilies: []
      dataShapes:
        - capability_matrix
      fields: []
      inputSchemaRefs:
        - schema://plugin/capability-request@1
      outputSchemaRefs:
        - schema://plugin/capability-matrix@1
      timeframes: []
      deterministic: true
      replayable: true
    dependencies: []
    evidence:
      - request_hash
      - plugin_manifest_hash
    pepCoverage: c1
    checkPacks:
      - plugin_manifest_integrity
    receiptClass: admin_evidence
    redaction: hash_or_ref
    noAdvice: true
    supportedProtocols:
