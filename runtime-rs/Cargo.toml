[package]
name = "tradeassembly-runtime"
version = "0.1.0"
edition = "2021"
publish = false
license-file = "../LICENSE"
build = "build.rs"

[[bin]]
name = "tradeassembly"
path = "src/bin/tradeassembly.rs"

[[bin]]
name = "tradeassembly-core-runner"
path = "src/bin/tradeassembly_core_runner.rs"

[[bin]]
name = "tradeassembly-connected-runner"
path = "src/bin/tradeassembly_connected_runner.rs"

[[bin]]
name = "tradeassembly-sandbox"
path = "src/bin/tradeassembly_sandbox.rs"

[dependencies]
aes-gcm = "0.10"
async-graphql = "7"
async-nats = "0.49.1"
axum = "0.8"
base64 = "0.22"
cel-interpreter = { package = "cel", version = "0.14.0", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "2"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
futures-util = "0.3"
jsonschema = { version = "0.48.5", default-features = false }
jsonwebtoken = "9"
keyring = "4.2.0"
libc = "0.2"
postgres = "0.19"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
schemars = "1.2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "0.3.2"
serde_path_to_error = "0.1"
serde_yaml = "0.9"
sha2 = "0.10"
tar = "0.4"
tradeassembly-sightline-sidecar = { path = "../sightline-sidecar" }
tradeassembly-plugin-sdk = { path = "../plugin-sdk" }
tradeassembly-identity-sdk = { path = "../identity-sdk" }
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "net", "sync", "time"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
url = "2"
webbrowser = "1"

[dev-dependencies]
openidconnect = "4.0.1"
rsa = "0.9.8"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
