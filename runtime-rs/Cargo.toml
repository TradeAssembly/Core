[package]
name = "tradeassembly-runtime"
version = "0.2.0"
edition = "2021"
publish = false
license-file = "../LICENSE"

[dependencies]
tradeassembly-strategy = { path = "../strategy" }
tradeassembly-simulation = { path = "../simulation" }
aes-gcm = "0.10"
async-graphql = "7"
async-nats = "0.49.1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "2"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
futures-util = "0.3"
jsonschema = { version = "0.48.5", default-features = false }
jsonwebtoken = "9"
keyring = { package = "keyring-core", version = "1.0.0" }
libc = "0.2"
postgres = "0.19"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
schemars = "1.2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "0.3.2"
serde_yaml = { package = "yaml_serde", version = "0.10.7" }
sha2 = "0.10"
tar = "0.4"
tradeassembly-sightline-sidecar = { path = "../sightline-sidecar" }
tradeassembly-plugin-sdk = { path = "../plugin-sdk" }
tradeassembly-identity-sdk = { path = "../identity-sdk" }
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "net", "sync", "time"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
url = "2"
webbrowser = "1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
atomicwrites = "0.4.4"
getrandom = "0.3"
hex = "0.4"
windows-permissions = "0.2.4"
winapi-util = "0.1.11"

[target.'cfg(windows)'.dev-dependencies]
fs2 = "0.4"

[dev-dependencies]
aws-lc-rs = "=1.18.1"
pkcs1 = "=0.7.5"
ring = "=0.17.14"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1.0"

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
dbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust", "vendored"] }
