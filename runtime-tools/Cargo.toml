[package]
name = "tradeassembly-runtime-tools"
version = "0.1.0"
edition = "2021"
publish = false
license-file = "../LICENSE"

[dependencies]
tradeassembly-runtime = { path = "../runtime-rs" }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
regex = "1"
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
walkdir = "2"
